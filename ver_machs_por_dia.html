<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Machs por Día - Dominó Pintintín</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .container-machs {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .fecha-display {
            background: #2c3e50;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }
        .tabla-machs {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        .tabla-machs th, .tabla-machs td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        .tabla-machs th {
            background: #3498db;
            color: white;
        }
        .tabla-machs tr:nth-child(even) {
            background: #f9f9f9;
        }
        .sin-datos {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
        .volver {
            background: #95a5a6;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .fecha-actual-info {
            font-size: 1.2em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container-machs">
        <button class="volver" onclick="window.location.href='index.html'">← Volver al juego</button>
        <h1>🏆 Machs jugados</h1>
        
        <div class="fecha-display">
            <strong>📅 Fecha actual:</strong>
            <div class="fecha-actual-info" id="fechaActual"></div>
        </div>
        
        <div id="contenidoMachs">
            <table class="tabla-machs" id="tablaMachs">
                <thead>
                    <tr><th>#</th><th>Fecha/Hora</th><th>Total patas</th><th>Ganadores</th></tr>
                </thead>
                <tbody id="tablaMachsBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Formatear fecha a dd/mm/yyyy
        function formatearFechaDDMMYYYY(fecha) {
            if (!fecha) return '';
            const d = new Date(fecha);
            if (isNaN(d.getTime())) return fecha;
            const dia = String(d.getDate()).padStart(2, '0');
            const mes = String(d.getMonth() + 1).padStart(2, '0');
            const anio = d.getFullYear();
            return `${dia}/${mes}/${anio}`;
        }
        
        function formatearFechaHoraDDMMYYYY(fechaHora) {
            if (!fechaHora) return '';
            const d = new Date(fechaHora);
            if (isNaN(d.getTime())) return fechaHora;
            const dia = String(d.getDate()).padStart(2, '0');
            const mes = String(d.getMonth() + 1).padStart(2, '0');
            const anio = d.getFullYear();
            let horas = d.getHours();
            const minutos = String(d.getMinutes()).padStart(2, '0');
            const ampm = horas >= 12 ? 'p.m.' : 'a.m.';
            horas = horas % 12 || 12;
            return `${dia}/${mes}/${anio} ${horas}:${minutos} ${ampm}`;
        }
        
        function getFechaActual() {
            const hoy = new Date();
            return hoy.toISOString().split('T')[0];
        }
        
        function formatearFechaParaComparar(fechaStr) {
            if (!fechaStr) return '';
            if (fechaStr.includes('/')) {
                const [dia, mes, anio] = fechaStr.split('/');
                return `${anio}-${mes}-${dia}`;
            }
            return fechaStr.split('T')[0];
        }
        
        function cargarMachsDelDia() {
            const fechaActual = getFechaActual();
            const fechaActualLegible = formatearFechaDDMMYYYY(new Date());
            document.getElementById('fechaActual').innerHTML = fechaActualLegible;
            
            const machsCompletados = JSON.parse(localStorage.getItem('pintintin_machs_completados') || '[]');
            const machsDelDia = machsCompletados.filter(mach => {
                const fechaMach = mach.fechaLegible || formatearFechaDDMMYYYY(mach.fecha);
                const fechaMachComparar = formatearFechaParaComparar(fechaMach);
                return fechaMachComparar === fechaActual || fechaMach === fechaActualLegible;
            });
            
            const tbody = document.getElementById('tablaMachsBody');
            tbody.innerHTML = '';
            
            if (machsDelDia.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="sin-datos">No hay machs registrados para el día de hoy</td></tr>';
                return;
            }
            
            machsDelDia.forEach((mach, index) => {
                const fila = tbody.insertRow();
                const ganadoresStr = mach.ganadoresPorPartida 
                    ? mach.ganadoresPorPartida.map((g, i) => `J${i+1}: ${g}`).join(', ')
                    : 'No disponible';
                
                const fechaHora = mach.fecha ? formatearFechaHoraDDMMYYYY(mach.fecha) : (mach.fechaLegible || 'Fecha no disponible');
                
                fila.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${fechaHora}</td>
                    <td>${mach.partidas?.length || 0}</td>
                    <td>${ganadoresStr}</td>
                `;
            });
        }
        
        document.addEventListener('DOMContentLoaded', cargarMachsDelDia);
    </script>
</body>
</html>
