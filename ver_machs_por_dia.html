<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ver Machs por Día - Dominó Pintintín</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f172a; font-family: system-ui, 'Segoe UI', Roboto, sans-serif; padding: 1rem; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.2); padding: 1.5rem; }
        h1 { color: #1e293b; border-bottom: 3px solid #8b5cf6; padding-bottom: 0.5rem; margin-bottom: 1rem; }
        .filtros { display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap; margin-bottom: 1.5rem; }
        .grupo-filtro { flex: 1; min-width: 200px; }
        .grupo-filtro label { display: block; font-size: 0.7rem; font-weight: bold; color: #475569; margin-bottom: 0.25rem; }
        .grupo-filtro select, .grupo-filtro button { width: 100%; padding: 0.6rem; border-radius: 0.5rem; border: 1px solid #cbd5e1; background: white; font-size: 0.9rem; }
        .grupo-filtro button { background: #8b5cf6; color: white; border: none; cursor: pointer; font-weight: bold; }
        .grupo-filtro button:hover { background: #7c3aed; }
        .btn-excel { background: #10b981 !important; }
        .btn-excel:hover { background: #059669 !important; }
        .tabla-responsive { overflow-x: auto; margin: 1rem 0; }
        .tabla-datos { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .tabla-datos th, .tabla-datos td { border: 1px solid #cbd5e1; padding: 0.5rem; text-align: left; vertical-align: top; }
        .tabla-datos th { background: #e2e8f0; position: sticky; top: 0; }
        .text-center { text-align: center; }
        .resumen-dia { background: #f1f5f9; padding: 1rem; border-radius: 0.8rem; margin: 1rem 0; }
        .resumen-dia h3 { margin-bottom: 0.5rem; color: #1e293b; }
        .resumen-dia p { margin: 0.25rem 0; }
        .info-tiempo { background: #e0e7ff; padding: 0.8rem; border-radius: 0.8rem; margin: 1rem 0; border-left: 4px solid #8b5cf6; }
        .btn-volver { background: #475569; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 0.6rem; font-weight: bold; cursor: pointer; margin-top: 1rem; }
        .btn-volver:hover { background: #334155; }
        footer { text-align: center; padding: 1rem; margin-top: 1.5rem; border-top: 1px solid #e2e8f0; color: #64748b; font-size: 0.8rem; }
        @media (max-width: 640px) { .filtros { flex-direction: column; } .grupo-filtro { width: 100%; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<div class="container">
    <h1>📋 Ver Machs por Día</h1>
    
    <div class="filtros">
        <div class="grupo-filtro">
            <label>📅 Selecciona fecha</label>
            <select id="selectorFecha"></select>
        </div>
        <div class="grupo-filtro">
            <button id="btnExportarCSV" class="btn-excel">📎 Exportar a CSV</button>
        </div>
        <div class="grupo-filtro">
            <button id="btnExportarPDF" class="btn-excel">📄 Exportar a PDF</button>
        </div>
    </div>
    
    <div id="resultados">
        <div class="info-tiempo" id="infoTiempo" style="display:none;"></div>
        <div class="tabla-responsive" id="tablaMachs"></div>
        <div id="resumenDia" class="resumen-dia" style="display:none;"></div>
        <div id="resumenGlobal" class="resumen-dia" style="display:none;"></div>
    </div>
    
    <button id="btnVolver" class="btn-volver">← Volver al juego</button>
    <footer>Dominó Pintintín - Historial de machs por día</footer>
</div>

<script>
    let jugadores = [];
    let dias = [];
    let machs = [];
    let datosDiaActual = null;

    function cargarDatos() {
        jugadores = JSON.parse(localStorage.getItem('pintintin_jugadores')) || [];
        dias = JSON.parse(localStorage.getItem('pintintin_dias')) || [];
        machs = JSON.parse(localStorage.getItem('pintintin_machs')) || [];
        
        for (let m of machs) {
            if (m.fechaHoraInicio === undefined) m.fechaHoraInicio = null;
        }
    }

    function formatearFechaDDMMYYYY(fechaISO) {
        if (!fechaISO) return '';
        const partes = fechaISO.split('-');
        if (partes.length !== 3) return fechaISO;
        return `${partes[2]}-${partes[1]}-${partes[0]}`;
    }

    function formatearHora(isoFecha) {
        if (!isoFecha) return '⏳ No registrada';
        const fecha = new Date(isoFecha);
        let horas = fecha.getHours();
        const minutos = fecha.getMinutes().toString().padStart(2, '0');
        const ampm = horas >= 12 ? 'p.m.' : 'a.m.';
        horas = horas % 12 || 12;
        return `${horas}:${minutos} ${ampm}`;
    }

    function calcularDuracionMach(mach) {
        if (!mach.fechaHoraInicio || !mach.fechaHora) return null;
        const inicio = new Date(mach.fechaHoraInicio);
        const fin = new Date(mach.fechaHora);
        const diffMs = fin - inicio;
        if (diffMs <= 0) return null;
        return Math.round(diffMs / 60000);
    }

    function cargarFecha() {
        const fecha = document.getElementById('selectorFecha').value;
        if (!fecha) return;
        
        const dia = dias.find(d => d.fecha === fecha);
        if (!dia) return;
        
        const machsDia = machs.filter(m => m.diaId === dia.id).sort((a, b) => a.numeroMach - b.numeroMach);
        
        datosDiaActual = { fecha, dia, machs: machsDia };
        
        // Calcular información de tiempo
        let tiempoTotal = 0;
        let machsConTiempo = 0;
        for (let m of machsDia) {
            const duracion = calcularDuracionMach(m);
            if (duracion !== null) {
                tiempoTotal += duracion;
                machsConTiempo++;
            }
        }
        const promedioTiempo = machsConTiempo > 0 ? Math.round(tiempoTotal / machsConTiempo) : 0;
        
        const infoTiempoDiv = document.getElementById('infoTiempo');
        if (machsConTiempo > 0) {
            infoTiempoDiv.style.display = 'block';
            infoTiempoDiv.innerHTML = `
                <strong>⏱️ ESTADÍSTICAS DE TIEMPO</strong><br>
                📊 Total de machs: ${machsDia.length}<br>
                ⏱️ Duración total de la sesión: ${tiempoTotal} minutos (${Math.floor(tiempoTotal/60)}h ${tiempoTotal%60}min)<br>
                📊 Promedio por mach: ${promedioTiempo} minutos
            `;
        } else {
            infoTiempoDiv.style.display = 'none';
        }
        
        // Tabla de machs
        let html = '<table class="tabla-datos"><thead>';
        html += '<tr><th># Mach</th><th>Hora de inicio</th><th>Hora de fin</th><th>Duración</th><th>Ganador</th><th>Participantes</th></tr></thead><tbody>';
        
        for (let m of machsDia) {
            const ganador = jugadores.find(j => j.id === m.ganadorId);
            const duracion = calcularDuracionMach(m);
            const duracionTexto = duracion ? `${duracion} min` : '⏳ No disponible';
            
            let participantesHtml = '';
            for (let p of m.participantes) {
                let nombre = p.nombre;
                if (p.jugadorId && !nombre) {
                    const jug = jugadores.find(j => j.id === p.jugadorId);
                    nombre = jug ? jug.nombre : `Jugador ${p.jugadorId}`;
                }
                participantesHtml += `<span class="stats-badge">🪑 ${nombre}: ${p.patasFinales || 0}🦶</span><br>`;
            }
            
            html += `<tr>
                <td class="text-center">${m.numeroMach}</td>
                <td class="text-center">${formatearHora(m.fechaHoraInicio)}</td>
                <td class="text-center">${formatearHora(m.fechaHora)}</td>
                <td class="text-center">${duracionTexto}</td>
                <td class="text-center"><strong>${ganador ? ganador.nombre : '?'}</strong></td>
                <td>${participantesHtml}</td>
            </tr>`;
        }
        
        html += '</tbody></table>';
        document.getElementById('tablaMachs').innerHTML = html;
        
        // Resumen del día (solo jugadores reales)
        const statsDia = new Map();
        for (let m of machsDia) {
            for (let p of m.participantes) {
                if (!p.jugadorId) continue;
                const nombre = p.nombre || (jugadores.find(j => j.id === p.jugadorId)?.nombre || `Jugador ${p.jugadorId}`);
                if (!statsDia.has(nombre)) {
                    statsDia.set(nombre, { machsGanados: 0, patasTotal: 0 });
                }
                if (p.jugadorId === m.ganadorId) {
                    statsDia.get(nombre).machsGanados++;
                }
                statsDia.get(nombre).patasTotal += (p.patasFinales || 0);
            }
        }
        
        const ordenado = Array.from(statsDia.entries()).sort((a, b) => b[1].machsGanados - a[1].machsGanados);
        let resumenHtml = '<h3>📊 RESUMEN DEL DÍA</h3>';
        resumenHtml += '<table class="tabla-datos"><thead><tr><th>Jugador</th><th>🏆 Machs ganados</th><th>🦶 Patas totales</th></tr></thead><tbody>';
        for (let [nombre, stats] of ordenado) {
            resumenHtml += `<tr><td><strong>${nombre}</strong></td><td class="text-center">${stats.machsGanados}</td><td class="text-center">${stats.patasTotal}</td></tr>`;
        }
        resumenHtml += '</tbody></table>';
        document.getElementById('resumenDia').style.display = 'block';
        document.getElementById('resumenDia').innerHTML = resumenHtml;
        
        // Resumen global acumulado
        const statsGlobal = new Map();
        for (let m of machs) {
            for (let p of m.participantes) {
                if (!p.jugadorId) continue;
                const nombre = p.nombre || (jugadores.find(j => j.id === p.jugadorId)?.nombre || `Jugador ${p.jugadorId}`);
                if (!statsGlobal.has(nombre)) {
                    statsGlobal.set(nombre, { machsGanados: 0, patasTotal: 0 });
                }
                if (p.jugadorId === m.ganadorId) {
                    statsGlobal.get(nombre).machsGanados++;
                }
                statsGlobal.get(nombre).patasTotal += (p.patasFinales || 0);
            }
        }
        
        const ordenadoGlobal = Array.from(statsGlobal.entries()).sort((a, b) => b[1].machsGanados - a[1].machsGanados);
        let resumenGlobalHtml = '<h3>📊 RESUMEN GENERAL (TODOS LOS DÍAS)</h3>';
        resumenGlobalHtml += '<table class="tabla-datos"><thead><tr><th>Jugador</th><th>🏆 Machs ganados</th><th>🦶 Patas totales</th></tr></thead><tbody>';
        for (let [nombre, stats] of ordenadoGlobal) {
            resumenGlobalHtml += `<tr><td><strong>${nombre}</strong></td><td class="text-center">${stats.machsGanados}</td><td class="text-center">${stats.patasTotal}</td></tr>`;
        }
        resumenGlobalHtml += '</tbody></table>';
        document.getElementById('resumenGlobal').style.display = 'block';
        document.getElementById('resumenGlobal').innerHTML = resumenGlobalHtml;
    }

    function exportarCSV() {
        if (!datosDiaActual || !datosDiaActual.machs.length) {
            alert('Primero selecciona una fecha con machs');
            return;
        }
        
        let csv = "N° Mach,Ganador,Participantes (Nombre:Patas)\n";
        for (let m of datosDiaActual.machs) {
            const ganador = jugadores.find(j => j.id === m.ganadorId);
            const participantes = m.participantes.map(p => {
                let nombre = p.nombre;
                if (p.jugadorId && !nombre) {
                    const jug = jugadores.find(j => j.id === p.jugadorId);
                    nombre = jug ? jug.nombre : `Jugador ${p.jugadorId}`;
                }
                return `${nombre}:${p.patasFinales || 0}`;
            }).join(', ');
            csv += `${m.numeroMach},"${ganador ? ganador.nombre : '?'}","${participantes}"\n`;
        }
        
        const blob = new Blob(["\uFEFF" + csv], {type: 'text/csv;charset=utf-8;'});
        const a = document.createElement('a');
        a.download = `machs_${datosDiaActual.fecha}.csv`;
        a.href = URL.createObjectURL(blob);
        a.click();
    }

    function exportarPDF() {
        if (!datosDiaActual || !datosDiaActual.machs.length) {
            alert('Primero selecciona una fecha con machs');
            return;
        }
        
        if (typeof window.jspdf === 'undefined' && typeof jspdf === 'undefined') {
            alert('❌ La librería PDF no está cargada. Recarga la página.');
            return;
        }
        
        const { jsPDF } = window.jspdf || jspdf;
        const doc = new jsPDF('landscape', 'mm', 'a4');
        
        doc.setFontSize(16);
        doc.text(`Machs del día ${formatearFechaDDMMYYYY(datosDiaActual.fecha)}`, 20, 20);
        doc.setFontSize(10);
        doc.text(`Generado: ${new Date().toLocaleString()}`, 20, 30);
        
        const headers = ['N° Mach', 'Hora inicio', 'Hora fin', 'Duración', 'Ganador', 'Participantes (Nombre:Patas)'];
        const data = datosDiaActual.machs.map(m => {
            const ganador = jugadores.find(j => j.id === m.ganadorId);
            const duracion = calcularDuracionMach(m);
            const duracionTexto = duracion ? `${duracion} min` : 'N/D';
            const participantes = m.participantes.map(p => {
                let nombre = p.nombre;
                if (p.jugadorId && !nombre) {
                    const jug = jugadores.find(j => j.id === p.jugadorId);
                    nombre = jug ? jug.nombre : `Jugador ${p.jugadorId}`;
                }
                return `${nombre}:${p.patasFinales || 0}`;
            }).join(', ');
            return [m.numeroMach, formatearHora(m.fechaHoraInicio), formatearHora(m.fechaHora), duracionTexto, ganador ? ganador.nombre : '?', participantes];
        });
        
        doc.autoTable({
            head: [headers],
            body: data,
            startY: 40,
            theme: 'striped',
            styles: { fontSize: 7, cellPadding: 1.5 },
            headStyles: { fillColor: [139, 92, 246], textColor: 255 }
        });
        
        doc.save(`machs_${datosDiaActual.fecha}.pdf`);
    }

    function cargarSelectorFechas() {
        const selector = document.getElementById('selectorFecha');
        selector.innerHTML = '<option value="">-- Selecciona una fecha --</option>';
        
        const fechasConMachs = new Set();
        for (let m of machs) {
            const dia = dias.find(d => d.id === m.diaId);
            if (dia) fechasConMachs.add(dia.fecha);
        }
        
        const fechasOrdenadas = Array.from(fechasConMachs).sort().reverse();
        for (let fecha of fechasOrdenadas) {
            const option = document.createElement('option');
            option.value = fecha;
            option.textContent = formatearFechaDDMMYYYY(fecha);
            selector.appendChild(option);
        }
        
        if (fechasOrdenadas.length > 0) {
            selector.value = fechasOrdenadas[0];
            cargarFecha();
        }
        
        selector.addEventListener('change', cargarFecha);
    }

    function inicializar() {
        cargarDatos();
        cargarSelectorFechas();
        
        document.getElementById('btnExportarCSV').addEventListener('click', exportarCSV);
        document.getElementById('btnExportarPDF').addEventListener('click', exportarPDF);
        document.getElementById('btnVolver').addEventListener('click', () => {
            sessionStorage.setItem('volviendoDeMachs', 'true');
            window.location.href = 'index.html';
        });
    }
    
    inicializar();
</script>
</body>
</html>
