<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Análisis de Rendimiento - Dominó Pintintín v6.0.6</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f172a; font-family: system-ui, 'Segoe UI', Roboto, sans-serif; padding: 1rem; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 1rem; padding: 1.2rem; margin-bottom: 1.5rem; text-align: center; color: white; }
        .header h1 { font-size: 1.6rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .header p { opacity: 0.9; font-size: 0.85rem; }
        .panel { background: white; border-radius: 1rem; padding: 1.2rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .filtros { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; justify-content: space-between; margin-bottom: 1rem; }
        .grupo-filtro { flex: 1; min-width: 150px; }
        .grupo-filtro label { display: block; font-size: 0.7rem; font-weight: bold; color: #475569; margin-bottom: 0.25rem; }
        .grupo-filtro select, .grupo-filtro input, .grupo-filtro button { width: 100%; padding: 0.6rem; border-radius: 0.5rem; border: 1px solid #cbd5e1; background: white; font-size: 0.85rem; }
        .grupo-filtro button { background: #8b5cf6; color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .grupo-filtro button:hover { background: #7c3aed; }
        .radio-group { display: flex; gap: 1rem; align-items: center; background: #f1f5f9; padding: 0.3rem 1rem; border-radius: 2rem; }
        .radio-group label { display: flex; align-items: center; gap: 0.3rem; font-size: 0.8rem; cursor: pointer; }
        .comparador { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 1.2rem; margin-bottom: 1.5rem; }
        .card { background: white; border-radius: 1rem; padding: 1.2rem; box-shadow: 0 2px 5px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; }
        .card h3 { font-size: 1.1rem; color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        .metricas-clave { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 0.8rem; margin-bottom: 1rem; }
        .metrica { text-align: center; padding: 0.6rem; background: #f8fafc; border-radius: 0.8rem; }
        .metrica .valor { font-size: 1.6rem; font-weight: bold; color: #1e293b; }
        .metrica .label { font-size: 0.65rem; color: #64748b; }
        .tabla-comparativa { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        .tabla-comparativa th, .tabla-comparativa td { padding: 0.5rem; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .tabla-comparativa th { background: #f1f5f9; font-weight: bold; }
        .positivo { color: #10b981; font-weight: bold; }
        .negativo { color: #ef4444; }
        .acciones { display: flex; justify-content: center; gap: 1rem; margin-top: 1rem; flex-wrap: wrap; }
        .btn-volver { background: #475569; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 0.6rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-volver:hover { background: #334155; }
        .footer { text-align: center; padding: 1rem; font-size: 0.7rem; color: #64748b; }
        .mensaje { background: #fef3c7; padding: 1rem; border-radius: 0.5rem; text-align: center; margin: 1rem 0; color: #92400e; }
        .mensaje-error { background: #fee2e2; color: #dc2626; }
        .mensaje-exito { background: #dcfce7; color: #16a34a; }
        @media (max-width: 640px) { .dashboard { grid-template-columns: 1fr; } .filtros { flex-direction: column; } .comparador { flex-direction: column; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📊 Análisis de Rendimiento</h1>
        <p>Estadísticas calculadas DIRECTAMENTE desde los machs (máxima precisión)</p>
    </div>

    <div class="panel">
        <div class="filtros">
            <div class="grupo-filtro">
                <label>👥 Modo de análisis</label>
                <select id="modoAnalisis">
                    <option value="individual" selected>📌 Jugador individual</option>
                    <option value="comparacion">🔄 Comparar dos jugadores</option>
                </select>
            </div>
            <div class="grupo-filtro">
                <label>📅 Desde</label>
                <input type="date" id="fechaDesde">
            </div>
            <div class="grupo-filtro">
                <label>📅 Hasta</label>
                <input type="date" id="fechaHasta">
            </div>
            <div class="grupo-filtro">
                <button id="btnAnalizar">🔍 Analizar</button>
            </div>
            <div class="grupo-filtro">
                <button id="btnExportarPDF">📎 Exportar PDF</button>
            </div>
        </div>

        <div id="selectorIndividual" class="grupo-filtro" style="margin-top: 0.5rem;">
            <label>👤 Selecciona jugador</label>
            <select id="jugadorIndividual">
                <option value="">-- Cargando jugadores... --</option>
            </select>
        </div>

        <div id="selectorComparacion" class="comparador" style="display: none;">
            <div class="grupo-filtro">
                <label>👤 Jugador 1</label>
                <select id="jugadorComparar1">
                    <option value="">-- Seleccionar --</option>
                </select>
            </div>
            <div class="grupo-filtro">
                <label>👤 Jugador 2</label>
                <select id="jugadorComparar2">
                    <option value="">-- Seleccionar --</option>
                </select>
            </div>
        </div>
    </div>

    <div id="resultados">
        <div class="mensaje">📊 Selecciona un jugador y haz clic en "Analizar"</div>
    </div>

    <div class="acciones">
        <button id="btnCerrar" class="btn-volver">← Cerrar y volver al juego</button>
    </div>
    <div class="footer">Datos basados en el historial de partidas | Dominó Pintintín v6.0.6</div>
</div>

<script>
    // ==================== ANÁLISIS DE RENDIMIENTO v6.0.6 (CORREGIDO) ====================
    
    let datosReales = { jugadores: [], dias: [], machs: [] };
    let statsCache = null; // Cache de estadísticas para no recalcular innecesariamente

    // ==================== FUNCIONES DE FECHAS ====================
    function formatearFechaDDMMYYYY(fechaISO) {
        if (!fechaISO) return '';
        const partes = fechaISO.split('-');
        if (partes.length !== 3) return fechaISO;
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    // ==================== CARGA DE DATOS ====================
    function cargarDatosReales() {
        try {
            datosReales.jugadores = JSON.parse(localStorage.getItem('pintintin_jugadores')) || [];
            datosReales.dias = JSON.parse(localStorage.getItem('pintintin_dias')) || [];
            datosReales.machs = JSON.parse(localStorage.getItem('pintintin_machs')) || [];
            
            for (let m of datosReales.machs) {
                if (m.participantes === undefined) m.participantes = [];
                if (m.manos === undefined) m.manos = [];
                if (m.fechaHoraInicio === undefined) m.fechaHoraInicio = null;
            }
            console.log(`📊 Datos cargados: ${datosReales.jugadores.length} jugadores, ${datosReales.dias.length} días, ${datosReales.machs.length} machs`);
            console.log("Jugadores:", datosReales.jugadores.map(j => j.nombre).join(", "));
            return true;
        } catch(e) { 
            console.error("Error cargando datos:", e); 
            return false; 
        }
    }

    // ==================== INICIALIZAR FECHAS ====================
    function inicializarFechas() {
        const desdeInput = document.getElementById('fechaDesde');
        const hastaInput = document.getElementById('fechaHasta');
        if (!desdeInput || !hastaInput) return;
        
        let fechasConMachs = new Set();
        for (let m of datosReales.machs) {
            const dia = datosReales.dias.find(d => d.id === m.diaId);
            if (dia && dia.fecha) fechasConMachs.add(dia.fecha);
        }
        
        const fechasOrdenadas = Array.from(fechasConMachs).sort();
        
        if (fechasOrdenadas.length > 0) {
            desdeInput.value = fechasOrdenadas[0];
            hastaInput.value = fechasOrdenadas[fechasOrdenadas.length - 1];
        } else if (datosReales.dias.length > 0) {
            const diasOrdenados = [...datosReales.dias].sort((a,b) => a.fecha.localeCompare(b.fecha));
            desdeInput.value = diasOrdenados[0].fecha;
            hastaInput.value = diasOrdenados[diasOrdenados.length - 1].fecha;
        } else {
            const hoy = new Date().toISOString().slice(0,10);
            desdeInput.value = hoy;
            hastaInput.value = hoy;
        }
        console.log("📅 Fechas inicializadas:", desdeInput.value, "→", hastaInput.value);
    }

    function getFechasFiltro() { 
        return { 
            desde: document.getElementById('fechaDesde').value, 
            hasta: document.getElementById('fechaHasta').value 
        }; 
    }

    function getDiasIdsFiltrados(desde, hasta) {
        let diasFiltrados = datosReales.dias;
        if (desde) diasFiltrados = diasFiltrados.filter(d => d.fecha >= desde);
        if (hasta) diasFiltrados = diasFiltrados.filter(d => d.fecha <= hasta);
        return new Set(diasFiltrados.map(d => d.id));
    }

    function getMachsFiltrados(desde, hasta) {
        const idsDias = getDiasIdsFiltrados(desde, hasta);
        return datosReales.machs.filter(m => idsDias.has(m.diaId));
    }

    // ==================== CÁLCULO DE ESTADÍSTICAS ====================
    function calcularEstadisticasDesdeMachs() {
        const { desde, hasta } = getFechasFiltro();
        const machsFiltrados = getMachsFiltrados(desde, hasta);
        
        const stats = new Map();
        for (let j of datosReales.jugadores) {
            stats.set(j.id, {
                id: j.id,
                nombre: j.nombre,
                machsJugados: 0,
                machsGanados: 0,
                patasAcumuladas: 0,
                pollonas: 0,
                capicuas: 0,
                cierres: 0,
                pegado: 0,
                forros: 0,
                aguas: 0,
                paseManoDados: 0,
                paseManoRecibidos: 0,
                empatesParticipados: 0,
                empatesGanados: 0,
                patasPorEmpate: 0
            });
        }
        
        for (let mach of machsFiltrados) {
            let todosCero = true;
            for (let p of mach.participantes) {
                if (p.jugadorId && p.jugadorId !== mach.ganadorId && (p.patasFinales || 0) > 0) {
                    todosCero = false;
                    break;
                }
            }
            
            for (let p of mach.participantes) {
                if (!p.jugadorId) continue;
                const s = stats.get(p.jugadorId);
                if (!s) continue;
                
                s.machsJugados++;
                s.patasAcumuladas += p.patasFinales || 0;
                
                if (p.jugadorId === mach.ganadorId) {
                    s.machsGanados++;
                    if (todosCero) s.pollonas++;
                }
            }
            
            if (mach.manos && mach.manos.length > 0) {
                for (let mano of mach.manos) {
                    if (!mano.jugadorId) continue;
                    const s = stats.get(mano.jugadorId);
                    if (!s) continue;
                    
                    switch (mano.tipo) {
                        case 'forro': s.forros++; break;
                        case 'agua': s.aguas++; break;
                        case 'capicua': s.capicuas++; break;
                        case 'cierre': s.cierres++; break;
                        case 'pegado': s.pegado++; break;
                        case 'paseMano':
                        case 'paseManoDado': s.paseManoDados++; break;
                        case 'paseManoRecibido': s.paseManoRecibidos++; break;
                    }
                }
            }
        }
        
        // Filtrar solo jugadores con al menos un mach jugado
        const resultado = new Map();
        for (let [id, s] of stats) {
            if (s.machsJugados > 0) resultado.set(id, s);
        }
        
        console.log(`📊 Estadísticas calculadas: ${resultado.size} jugadores con datos`);
        return resultado;
    }

    // ==================== CARGAR SELECTORES (SIN perder la selección) ====================
    let cargandoSelectores = false;
    
    function cargarSelectores(statsMap, mantenerSeleccion = true) {
        if (cargandoSelectores) return;
        cargandoSelectores = true;
        
        const individualSelect = document.getElementById('jugadorIndividual');
        const comp1Select = document.getElementById('jugadorComparar1');
        const comp2Select = document.getElementById('jugadorComparar2');
        
        if (!individualSelect || !comp1Select || !comp2Select) {
            cargandoSelectores = false;
            return;
        }
        
        // Guardar selecciones actuales
        const seleccionIndividual = individualSelect.value;
        const seleccionComp1 = comp1Select.value;
        const seleccionComp2 = comp2Select.value;
        
        if (statsMap.size === 0) {
            const msg = '<option value="">-- No hay jugadores con datos --</option>';
            individualSelect.innerHTML = msg;
            comp1Select.innerHTML = msg;
            comp2Select.innerHTML = msg;
            cargandoSelectores = false;
            return;
        }
        
        // Ordenar jugadores por machs ganados (descendente)
        const jugadoresArray = Array.from(statsMap.values()).sort((a, b) => {
            if (a.machsGanados !== b.machsGanados) return b.machsGanados - a.machsGanados;
            if (a.patasAcumuladas !== b.patasAcumuladas) return b.patasAcumuladas - a.patasAcumuladas;
            return a.nombre.localeCompare(b.nombre);
        });
        
        const opciones = jugadoresArray.map(s => 
            `<option value="${s.id}">${escapeHtml(s.nombre)} (${s.machsGanados}🏆, ${s.machsJugados}🎲, ${s.patasAcumuladas}🦶)</option>`
        ).join('');
        
        individualSelect.innerHTML = opciones;
        comp1Select.innerHTML = opciones;
        comp2Select.innerHTML = opciones;
        
        // Restaurar selecciones anteriores si es posible
        if (mantenerSeleccion) {
            if (seleccionIndividual && seleccionIndividual !== "" && statsMap.has(parseInt(seleccionIndividual))) {
                individualSelect.value = seleccionIndividual;
            } else if (jugadoresArray.length > 0) {
                individualSelect.selectedIndex = 0;
            }
            
            if (seleccionComp1 && seleccionComp1 !== "" && statsMap.has(parseInt(seleccionComp1))) {
                comp1Select.value = seleccionComp1;
            } else if (jugadoresArray.length > 0) {
                comp1Select.selectedIndex = 0;
            }
            
            if (seleccionComp2 && seleccionComp2 !== "" && statsMap.has(parseInt(seleccionComp2))) {
                comp2Select.value = seleccionComp2;
            } else if (jugadoresArray.length > 1) {
                comp2Select.selectedIndex = Math.min(1, jugadoresArray.length - 1);
            } else if (jugadoresArray.length > 0) {
                comp2Select.selectedIndex = 0;
            }
        } else {
            if (jugadoresArray.length > 0) individualSelect.selectedIndex = 0;
            if (jugadoresArray.length > 0) comp1Select.selectedIndex = 0;
            if (jugadoresArray.length > 1) comp2Select.selectedIndex = Math.min(1, jugadoresArray.length - 1);
        }
        
        console.log(`✅ Selectores cargados con ${jugadoresArray.length} jugadores`);
        console.log(`   Individual seleccionado: ${individualSelect.value}`);
        console.log(`   Comp1 seleccionado: ${comp1Select.value}`);
        console.log(`   Comp2 seleccionado: ${comp2Select.value}`);
        
        cargandoSelectores = false;
    }

    // ==================== CÁLCULO DE MÉTRICAS ====================
    function calcularMetricas(s) {
        const efectividad = s.machsJugados ? (s.machsGanados / s.machsJugados * 100).toFixed(1) : 0;
        const promedioPatas = s.machsJugados ? (s.patasAcumuladas / s.machsJugados).toFixed(1) : 0;
        const eficiencia = s.patasAcumuladas ? (s.machsGanados * 5 / s.patasAcumuladas * 100).toFixed(1) : 0;
        const disciplina = (s.forros + s.aguas) / Math.max(1, s.machsJugados);
        return { efectividad, promedioPatas, eficiencia, disciplina };
    }

    function calcularCalificacion(s, metricas) {
        let puntos = 0;
        const eficienciaNum = parseFloat(metricas.eficiencia) || 0;
        if (eficienciaNum > 40) puntos += 30;
        else if (eficienciaNum > 35) puntos += 20;
        else if (eficienciaNum > 30) puntos += 15;
        else puntos += 5;
        
        const consistencia = Math.min(10, Math.abs(s.patasAcumuladas / Math.max(1, s.machsJugados) - 2.5));
        if (consistencia < 1) puntos += 30;
        else if (consistencia < 2) puntos += 20;
        else if (consistencia < 3) puntos += 15;
        else puntos += 5;
        
        const efectividadNum = parseFloat(metricas.efectividad) || 0;
        if (efectividadNum > 55) puntos += 20;
        else if (efectividadNum > 45) puntos += 15;
        else if (efectividadNum > 35) puntos += 10;
        else puntos += 5;
        
        const disciplina = metricas.disciplina || 0;
        if (disciplina < 0.5) puntos += 20;
        else if (disciplina < 1.0) puntos += 15;
        else if (disciplina < 1.5) puntos += 10;
        else puntos += 5;
        
        const puntuacion = Math.min(100, puntos);
        const estrellas = Math.min(5, Math.max(1, Math.round(puntuacion / 20)));
        return { puntuacion, estrellas };
    }

    // ==================== RENDERIZADO ====================
    function renderizarIndividual(s) {
        const metricas = calcularMetricas(s);
        const calificacion = calcularCalificacion(s, metricas);
        const estrellas = '★'.repeat(calificacion.estrellas) + '☆'.repeat(5 - calificacion.estrellas);
        
        return `
            <div class="dashboard">
                <div class="card">
                    <h3>📋 ${escapeHtml(s.nombre)} - Resumen</h3>
                    <div class="metricas-clave">
                        <div class="metrica"><div class="valor">${s.machsJugados}</div><div class="label">Machs jugados</div></div>
                        <div class="metrica"><div class="valor">${s.machsGanados}</div><div class="label">Machs ganados</div></div>
                        <div class="metrica"><div class="valor">${metricas.efectividad}%</div><div class="label">Efectividad</div></div>
                        <div class="metrica"><div class="valor">${s.patasAcumuladas}</div><div class="label">Patas totales</div></div>
                    </div>
                    <div class="metricas-clave">
                        <div class="metrica"><div class="valor">${s.forros}</div><div class="label">🧤 Forros</div></div>
                        <div class="metrica"><div class="valor">${s.aguas}</div><div class="label">💧 Aguas</div></div>
                        <div class="metrica"><div class="valor">${s.pollonas}</div><div class="label">🐔 Pollonas</div></div>
                        <div class="metrica"><div class="valor">${s.capicuas}</div><div class="label">🀰 Capicuas</div></div>
                    </div>
                    <div class="metricas-clave">
                        <div class="metrica"><div class="valor">${s.cierres}</div><div class="label">🚪 Cierres</div></div>
                        <div class="metrica"><div class="valor">${s.pegado}</div><div class="label">🏃 Pegados</div></div>
                        <div class="metrica"><div class="valor">${s.paseManoDados}</div><div class="label">🎯 PM Dados</div></div>
                        <div class="metrica"><div class="valor">${s.paseManoRecibidos}</div><div class="label">📥 PM Recibidos</div></div>
                    </div>
                    <div class="metricas-clave">
                        <div class="metrica"><div class="valor">${s.empatesParticipados}</div><div class="label">⚖️ Empates</div></div>
                        <div class="metrica"><div class="valor">${s.empatesGanados}</div><div class="label">🏆⚖️ E. Ganados</div></div>
                        <div class="metrica"><div class="valor">${s.patasPorEmpate}</div><div class="label">🧩 Patas x Empate</div></div>
                        <div class="metrica"><div class="valor">${metricas.disciplina.toFixed(2)}</div><div class="label">🧹 Disciplina</div></div>
                    </div>
                    <div style="text-align: center; margin-top: 1rem; padding-top: 0.5rem; border-top: 1px solid #e2e8f0;">
                        <div style="font-size: 1.2rem; letter-spacing: 2px;">${estrellas}</div>
                        <div style="font-size: 0.8rem; color: #64748b;">Puntuación: ${calificacion.puntuacion}/100</div>
                    </div>
                </div>
            </div>
        `;
    }

    function renderizarComparativa(s1, s2) {
        const m1 = calcularMetricas(s1);
        const m2 = calcularMetricas(s2);
        const cal1 = calcularCalificacion(s1, m1);
        const cal2 = calcularCalificacion(s2, m2);
        
        return `
            <div class="dashboard">
                <div class="card">
                    <h3>📋 ${escapeHtml(s1.nombre)}</h3>
                    <div class="metricas-clave">
                        <div class="metrica"><div class="valor">${s1.machsJugados}</div><div class="label">Jugados</div></div>
                        <div class="metrica"><div class="valor">${s1.machsGanados}</div><div class="label">Ganados</div></div>
                        <div class="metrica"><div class="valor">${m1.efectividad}%</div><div class="label">Efectividad</div></div>
                        <div class="metrica"><div class="valor">${s1.patasAcumuladas}</div><div class="label">Patas</div></div>
                    </div>
                    <div class="metricas-clave">
                        <div class="metrica"><div class="valor">${s1.forros}</div><div class="label">🧤</div></div>
                        <div class="metrica"><div class="valor">${s1.aguas}</div><div class="label">💧</div></div>
                        <div class="metrica"><div class="valor">${s1.pollonas}</div><div class="label">🐔</div></div>
                        <div class="metrica"><div class="valor">${s1.capicuas}</div><div class="label">🀰</div></div>
                    </div>
                    <div style="text-align: center; margin-top: 0.5rem;">
                        <span style="font-size: 1rem;">${'★'.repeat(cal1.estrellas)}${'☆'.repeat(5 - cal1.estrellas)}</span>
                        <span style="font-size: 0.7rem; margin-left: 0.5rem;">${cal1.puntuacion}/100</span>
                    </div>
                </div>
                <div class="card">
                    <h3>📋 ${escapeHtml(s2.nombre)}</h3>
                    <div class="metricas-clave">
                        <div class="metrica"><div class="valor">${s2.machsJugados}</div><div class="label">Jugados</div></div>
                        <div class="metrica"><div class="valor">${s2.machsGanados}</div><div class="label">Ganados</div></div>
                        <div class="metrica"><div class="valor">${m2.efectividad}%</div><div class="label">Efectividad</div></div>
                        <div class="metrica"><div class="valor">${s2.patasAcumuladas}</div><div class="label">Patas</div></div>
                    </div>
                    <div class="metricas-clave">
                        <div class="metrica"><div class="valor">${s2.forros}</div><div class="label">🧤</div></div>
                        <div class="metrica"><div class="valor">${s2.aguas}</div><div class="label">💧</div></div>
                        <div class="metrica"><div class="valor">${s2.pollonas}</div><div class="label">🐔</div></div>
                        <div class="metrica"><div class="valor">${s2.capicuas}</div><div class="label">🀰</div></div>
                    </div>
                    <div style="text-align: center; margin-top: 0.5rem;">
                        <span style="font-size: 1rem;">${'★'.repeat(cal2.estrellas)}${'☆'.repeat(5 - cal2.estrellas)}</span>
                        <span style="font-size: 0.7rem; margin-left: 0.5rem;">${cal2.puntuacion}/100</span>
                    </div>
                </div>
            </div>
            <div class="card">
                <h3>📊 Comparativa directa</h3>
                <table class="tabla-comparativa">
                    <thead><tr><th>Indicador</th><th>${escapeHtml(s1.nombre)}</th><th>${escapeHtml(s2.nombre)}</th><th>Ventaja</th></tr></thead>
                    <tbody>
                        <tr><td>🏆 Machs ganados</td><td>${s1.machsGanados}</td><td>${s2.machsGanados}</td><td class="${s1.machsGanados > s2.machsGanados ? 'positivo' : 'negativo'}">${s1.machsGanados > s2.machsGanados ? s1.nombre : s2.nombre}</td></tr>
                        <tr><td>🦶 Patas totales</td><td>${s1.patasAcumuladas}</td><td>${s2.patasAcumuladas}</td><td class="${s1.patasAcumuladas > s2.patasAcumuladas ? 'positivo' : 'negativo'}">${s1.patasAcumuladas > s2.patasAcumuladas ? s1.nombre : s2.nombre}</td></tr>
                        <tr><td>📈 Efectividad</td><td>${m1.efectividad}%</td><td>${m2.efectividad}%</td><td class="${parseFloat(m1.efectividad) > parseFloat(m2.efectividad) ? 'positivo' : 'negativo'}">${parseFloat(m1.efectividad) > parseFloat(m2.efectividad) ? s1.nombre : s2.nombre}</td></tr>
                        <tr><td>🧤 Forros</td><td>${s1.forros}</td><td>${s2.forros}</td><td class="${s1.forros < s2.forros ? 'positivo' : 'negativo'}">${s1.forros < s2.forros ? s1.nombre : s2.nombre}</td></tr>
                        <tr><td>💧 Aguas</td><td>${s1.aguas}</td><td>${s2.aguas}</td><td class="${s1.aguas < s2.aguas ? 'positivo' : 'negativo'}">${s1.aguas < s2.aguas ? s1.nombre : s2.nombre}</td></tr>
                        <tr><td>🐔 Pollonas</td><td>${s1.pollonas}</td><td>${s2.pollonas}</td><td class="${s1.pollonas > s2.pollonas ? 'positivo' : 'negativo'}">${s1.pollonas > s2.pollonas ? s1.nombre : s2.nombre}</td></tr>
                        <tr><td>🀰 Capicuas</td><td>${s1.capicuas}</td><td>${s2.capicuas}</td><td class="${s1.capicuas > s2.capicuas ? 'positivo' : 'negativo'}">${s1.capicuas > s2.capicuas ? s1.nombre : s2.nombre}</td></tr>
                        <tr><td>🎯 PM Dados</td><td>${s1.paseManoDados}</td><td>${s2.paseManoDados}</td><td class="${s1.paseManoDados < s2.paseManoDados ? 'positivo' : 'negativo'}">${s1.paseManoDados < s2.paseManoDados ? s1.nombre : s2.nombre}</td></tr>
                    </tbody>
                </table>
            </div>
        `;
    }

    // ==================== ANÁLISIS PRINCIPAL ====================
    function analizar() {
        console.log("🔍 Ejecutando análisis...");
        const statsMap = calcularEstadisticasDesdeMachs();
        statsCache = statsMap;
        
        if (statsMap.size === 0) {
            document.getElementById('resultados').innerHTML = '<div class="mensaje mensaje-error">⚠️ No hay datos de jugadores en el período seleccionado. Asegúrate de que haya machs registrados.</div>';
            return;
        }
        
        // Cargar selectores manteniendo la selección actual
        cargarSelectores(statsMap, true);
        
        const modo = document.getElementById('modoAnalisis').value;
        const resultadosDiv = document.getElementById('resultados');
        
        if (modo === 'individual') {
            const selectJugador = document.getElementById('jugadorIndividual');
            const jugadorId = parseInt(selectJugador.value);
            const jugador = statsMap.get(jugadorId);
            
            if (jugador && jugador.machsJugados > 0) {
                resultadosDiv.innerHTML = renderizarIndividual(jugador);
                console.log(`✅ Mostrando análisis individual de: ${jugador.nombre}`);
            } else {
                resultadosDiv.innerHTML = '<div class="mensaje mensaje-error">⚠️ Selecciona un jugador válido.</div>';
            }
        } else {
            const j1Id = parseInt(document.getElementById('jugadorComparar1').value);
            const j2Id = parseInt(document.getElementById('jugadorComparar2').value);
            const j1 = statsMap.get(j1Id);
            const j2 = statsMap.get(j2Id);
            
            if (j1 && j2 && j1.machsJugados > 0 && j2.machsJugados > 0) {
                resultadosDiv.innerHTML = renderizarComparativa(j1, j2);
                console.log(`✅ Mostrando comparativa entre: ${j1.nombre} y ${j2.nombre}`);
            } else {
                resultadosDiv.innerHTML = '<div class="mensaje mensaje-error">⚠️ Selecciona dos jugadores válidos.</div>';
            }
        }
    }

    // ==================== EXPORTAR PDF ====================
    async function exportarPDF() {
        const resultadosDiv = document.getElementById('resultados');
        if (!resultadosDiv || !resultadosDiv.innerHTML.trim() || resultadosDiv.innerHTML.includes('Selecciona')) {
            alert('No hay datos para exportar. Primero realiza un análisis.');
            return;
        }
        
        if (typeof window.jspdf === 'undefined' && typeof jspdf === 'undefined') {
            alert('❌ La librería PDF no está cargada. Recarga la página.');
            return;
        }
        
        const { jsPDF } = window.jspdf || jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        
        doc.setFontSize(16);
        doc.text("Análisis de Rendimiento - Dominó Pintintín v6.0.6", 20, 20);
        doc.setFontSize(10);
        doc.text(`Generado: ${new Date().toLocaleString()}`, 20, 30);
        
        const desde = document.getElementById('fechaDesde').value;
        const hasta = document.getElementById('fechaHasta').value;
        const desdeMostrar = desde ? formatearFechaDDMMYYYY(desde) : 'inicio';
        const hastaMostrar = hasta ? formatearFechaDDMMYYYY(hasta) : 'hoy';
        doc.text(`Período: ${desdeMostrar} al ${hastaMostrar}`, 20, 38);
        
        const tablas = resultadosDiv.querySelectorAll('table');
        let yOffset = 50;
        
        for (let i = 0; i < tablas.length; i++) {
            const table = tablas[i];
            const headers = [];
            const headerRows = table.querySelectorAll('thead tr');
            if (headerRows.length) {
                headerRows[0].querySelectorAll('th').forEach(th => {
                    let texto = th.innerText.trim();
                    if (texto) headers.push(texto);
                });
            }
            
            const data = [];
            const bodyRows = table.querySelectorAll('tbody tr');
            bodyRows.forEach(row => {
                const rowData = [];
                row.querySelectorAll('td').forEach(td => rowData.push(td.innerText.trim()));
                if (rowData.length) data.push(rowData);
            });
            
            if (headers.length && data.length) {
                if (yOffset > 250) { doc.addPage(); yOffset = 20; }
                doc.autoTable({
                    head: [headers],
                    body: data,
                    startY: yOffset,
                    theme: 'striped',
                    styles: { fontSize: 8, cellPadding: 2 },
                    headStyles: { fillColor: [139, 92, 246], textColor: 255 },
                    margin: { left: 10, right: 10 }
                });
                yOffset = doc.lastAutoTable.finalY + 10;
            }
        }
        
        doc.save(`analisis_pintintin_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.pdf`);
        alert("✅ PDF exportado correctamente");
    }

    // ==================== TOGGLE MODO ====================
    function toggleModo() {
        const modo = document.getElementById('modoAnalisis').value;
        document.getElementById('selectorIndividual').style.display = modo === 'individual' ? 'block' : 'none';
        document.getElementById('selectorComparacion').style.display = modo === 'comparacion' ? 'flex' : 'none';
        
        // Recargar estadísticas y actualizar vista
        const statsMap = calcularEstadisticasDesdeMachs();
        statsCache = statsMap;
        if (statsMap.size > 0) {
            cargarSelectores(statsMap, true);
            analizar(); // Actualizar resultados
        }
    }

    // ==================== ESCAPE HTML ====================
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // ==================== INICIALIZACIÓN ====================
    function inicializar() {
        console.log("🚀 Iniciando módulo de Análisis de Rendimiento v6.0.6");
        
        if (!cargarDatosReales()) {
            document.getElementById('resultados').innerHTML = '<div class="mensaje mensaje-error">❌ Error al cargar datos. Asegúrate de haber iniciado una partida.</div>';
            return;
        }
        
        if (datosReales.machs.length === 0) {
            document.getElementById('resultados').innerHTML = '<div class="mensaje mensaje-error">⚠️ No hay machs registrados. Inicia una partida primero.</div>';
            return;
        }
        
        inicializarFechas();
        
        const statsMap = calcularEstadisticasDesdeMachs();
        statsCache = statsMap;
        
        if (statsMap.size === 0) {
            document.getElementById('resultados').innerHTML = '<div class="mensaje mensaje-error">⚠️ No hay jugadores con datos en el período seleccionado.</div>';
            return;
        }
        
        // Cargar selectores por primera vez
        cargarSelectores(statsMap, false);
        
        // Configurar eventos
        const modoSelect = document.getElementById('modoAnalisis');
        const btnAnalizar = document.getElementById('btnAnalizar');
        const btnExportarPDF = document.getElementById('btnExportarPDF');
        const btnCerrar = document.getElementById('btnCerrar');
        const fechaDesde = document.getElementById('fechaDesde');
        const fechaHasta = document.getElementById('fechaHasta');
        const individualSelect = document.getElementById('jugadorIndividual');
        const comp1Select = document.getElementById('jugadorComparar1');
        const comp2Select = document.getElementById('jugadorComparar2');
        
        if (modoSelect) modoSelect.addEventListener('change', toggleModo);
        if (btnAnalizar) btnAnalizar.addEventListener('click', analizar);
        if (btnExportarPDF) btnExportarPDF.addEventListener('click', exportarPDF);
        if (btnCerrar) btnCerrar.addEventListener('click', () => window.location.href = 'index.html');
        if (fechaDesde) fechaDesde.addEventListener('change', analizar);
        if (fechaHasta) fechaHasta.addEventListener('change', analizar);
        if (individualSelect) individualSelect.addEventListener('change', analizar);
        if (comp1Select) comp1Select.addEventListener('change', analizar);
        if (comp2Select) comp2Select.addEventListener('change', analizar);
        
        // Ejecutar análisis inicial
        setTimeout(() => analizar(), 100);
    }
    
    inicializar();
</script>
</body>
